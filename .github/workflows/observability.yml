name: observability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-${{ github.event.pull_request.number || github.ref }}
  # Obsolete pull-request heads are cancelled; a running main validation always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Select the Rust toolchain
      run: |
        rustup show active-toolchain
    - uses: NDDev-Technocracy-OpenNetwork/nddev-ci/actions/hosted-cache@85c691357b27e79e8b9eb7a2b7130fb179cd4c13 # v0.6.172
    - name: Format
      shell: bash
      run: |
        cargo fmt --all -- --check
    - name: Clippy
      shell: bash
      run: |
        cargo clippy --locked -p rds-observe --all-targets -- -D warnings
    - name: Build the fixture and record its path
      shell: bash
      run: |
        set -o pipefail
        fixture=$(cargo build --locked -p rds-observe --example fixture --message-format=json-render-diagnostics \
          | jq -er 'select(.reason == "compiler-artifact" and .target.kind == ["example"] and .target.name == "fixture") | .executable')
        test -x "$fixture"
        printf 'RDS_OBSERVE_FIXTURE=%s\n' "$fixture" >> "$GITHUB_ENV"
    - name: Test
      shell: bash
      run: |
        bash -euo pipefail -c ' . ops/observability/images.env; pull_image() {
          for delay in 0 10 30; do
            sleep "$delay";
            if timeout 120 docker pull "$1"; then return 0; fi;
          done;
          return 1;
        }; pull_image "$RDS_VECTOR_IMAGE"; pull_image "$RDS_OPENOBSERVE_IMAGE"; cargo test --locked -p rds-observe --test pipeline -- --ignored --nocapture'
